name: "CodeQL"

on: [push, pull_request]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: cpp
            build-mode: manual
            suppression-query: codeql/cpp-queries:AlertSuppression.ql
          - language: actions
            build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Install prereqs and run qmake
      if: matrix.language == 'cpp'
      run: |
        nproc
        sudo apt-get update
        sudo apt-get install -y make qt6-base-dev g++ libpng-dev qt6-tools-dev-tools qmake6
        ./configure --enable-debug
        make -C gui Makefile.qmake

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.39.3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-extended
        packs: ${{ matrix.suppression-query }}

    - name: Build app
      if: matrix.language == 'cpp'
      run: |
        echo "Building app (might segfault at the lrelease step)"
        make -j$(nproc) || true

    - name: Perform CodeQL Analysis
      id: analyze
      uses: github/codeql-action/analyze@v4.39.3
      with:
        category: "/language:${{matrix.language}}"
        output: sarif-results

    # Alert dismissal is repository-wide; never apply feature-branch suppressions.
    - name: Apply source suppressions
      if: matrix.language == 'cpp' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8 # v2.0.3
      with:
        sarif-id: ${{ steps.analyze.outputs.sarif-id }}
        sarif-file: sarif-results/cpp.sarif
      env:
        GITHUB_TOKEN: ${{ github.token }}
