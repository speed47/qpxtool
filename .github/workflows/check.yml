name: check

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actions-lock:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify workflow dependencies
        run: gh actions-lock --verify

  win64:
    needs: lint
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: UCRT64
          update: false
          install: git make pkg-config mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-qt6-tools
      - name: git config
        run: git config --global core.autocrlf input
        shell: bash
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: configure (debug)
        run: ./configure --enable-debug
      - name: make (debug)
        run: nproc && make -j$(nproc)
      - name: check executable (debug)
        run: |
          file gui/debug/qpxtool.exe
          file gui/debug/qpxtool.exe | grep -q 'x86-64'
          file gui/debug/qpxtool.exe | grep -q 'for MS Windows'
      - name: configure (release)
        id: conf
        run: make clean && ./configure
      - name: make (release)
        run: nproc && make -j$(nproc)
      - name: check executable (release)
        run: |
          file gui/release/qpxtool.exe
          file gui/release/qpxtool.exe | grep -q 'x86-64'
          file gui/release/qpxtool.exe | grep -q 'for MS Windows'

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test workflow helpers and device policy
        run: python3 -m unittest discover -s .github/tests -v
      - name: install clang-format-19
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc
          . /etc/lsb-release
          sudo add-apt-repository -y "deb http://apt.llvm.org/$DISTRIB_CODENAME/ llvm-toolchain-$DISTRIB_CODENAME-19 main"
          sudo apt-get update && sudo apt-get install -y clang-format-19
      - name: configure
        run: ./configure --disable-gui
      - name: lint
        run: make lint

  linux64-gui:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: install prerequisites
        run: |
            sudo apt-get update
            sudo apt-get install -y make qt6-base-dev g++ libpng-dev qt6-tools-dev-tools
      - name: configure (debug)
        run: ./configure --enable-debug
      - name: make (debug)
        run: nproc && make -j$(nproc)
      - name: Test daemon device access
        env:
          QSCAND_TEST_BINARY: console/qscand/qscand
          LD_LIBRARY_PATH: ${{ github.workspace }}/lib/lib
        run: python3 -m unittest discover -s .github/tests -p test_qscand_devices.py -v
      - name: check executable (debug)
        run: |
            file gui/qpxtool
            file gui/qpxtool | grep -q 'x86-64'
      - name: configure (release)
        run: make clean && ./configure
      - name: make (release)
        run: nproc && make -j$(nproc)
      - name: check executable (release)
        run: |
            file gui/qpxtool
            file gui/qpxtool | grep -q 'x86-64'

  mac:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runs-on: macos-15
          - arch: x86_64
            runs-on: macos-15-intel
    runs-on: ${{ matrix.runs-on }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: install prerequisites
      env:
        HOMEBREW_NO_INSTALL_CLEANUP: 1
      run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          brew install qt@6
    - name: set up Qt
      run: |
          qt_prefix="$(brew --prefix qt@6)"
          echo "$qt_prefix/bin" >> "$GITHUB_PATH"
          echo "CFLAGS=-L$qt_prefix/lib -I$qt_prefix/include" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-L$qt_prefix/lib -I$qt_prefix/include" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$qt_prefix/lib/pkgconfig" >> "$GITHUB_ENV"
    - name: configure
      run: |
          ./configure --prefix=$PWD/dist
    - name: make
      run: |
          make -j$(sysctl -n hw.ncpu || echo 2)
          make install
    - name: check executable architectures
      run: |
          lipo dist/bin/qpxtool -verify_arch "${{ matrix.arch }}"
          lipo dist/bin/qscan -verify_arch "${{ matrix.arch }}"
    - name: check executability
      run: |
          env DYLD_LIBRARY_PATH="$PWD/dist/lib" ./dist/bin/qscan --help
          env DYLD_LIBRARY_PATH="$PWD/dist/lib" ./dist/bin/qscan --help | grep -q 'qscan is a CD/DVD'

